[package]
name = "airworks"
version = "1.0.0"
edition = "2021"
authors = ["The Ventryx Company"]
description = "Airworks - Build the Flow - Duct construction and airflow simulation game"
license = "MIT"
repository = "https://github.com/Chronos64Bit/airworks"

[dependencies]
tauri = { version = "2.4.0", features = [] }
tauri-plugin-shell = "2.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[features]
default = []
